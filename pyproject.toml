[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rpg-npc-dialogue-engine"
version = "1.0.0"
description = "Deterministic emotional state machine and template-based dialogue engine for RPG NPCs built from first principles"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.scripts]
rpg-npc = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
